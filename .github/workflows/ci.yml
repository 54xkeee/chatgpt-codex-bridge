name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Guard contract tests
        run: python3 -m unittest tests.bridge.test-codex-mcp-guard
      - name: Run ZCode provider contract tests
        run: python3 -m unittest tests.bridge.test-zcode-mcp-guard
      - name: Verify packaged Guard identity
        run: cmp scripts/bridge/codex-mcp-guard.py plugins/chatgpt-codex-bridge/bridge/codex-mcp-guard.py

  powershell-51-paths:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PowerShell 5.1 path validation
        shell: powershell
        run: .\tests\windows\test_windows_port.ps1 -PathValidationOnly
