name: Apply job control fixup

on:
  push:
    branches:
      - feat/job-control-transcript-handoff

permissions:
  contents: write

jobs:
  fixup:
    if: ${{ !contains(github.event.head_commit.message, '[controller-fixup-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/job-control-transcript-handoff
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply race fix and focused tests
        run: python3 scripts/dev/apply_job_control_fixup.py
      - name: Run full guard contract suite
        run: |
          python3 -m py_compile scripts/bridge/codex-mcp-guard.py
          cmp scripts/bridge/codex-mcp-guard.py plugins/chatgpt-codex-bridge/bridge/codex-mcp-guard.py
          git diff --check
          python3 -m unittest tests.bridge.test-codex-mcp-guard
      - name: Commit validated fixup
        run: |
          git config user.name 'chatgpt-controller'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/bridge/codex-mcp-guard.py plugins/chatgpt-codex-bridge/bridge/codex-mcp-guard.py tests/bridge/test-codex-mcp-guard.py
          git commit -m 'test: harden scoped lifecycle controls [controller-fixup-applied]'
          git push origin HEAD:feat/job-control-transcript-handoff
